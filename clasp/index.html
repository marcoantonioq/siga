<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGA Lite - Ultra Edition</title>

  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Material+Icons" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/quasar@2.12.0/dist/quasar.prod.css" rel="stylesheet" type="text/css">
  
  <style>
    [v-cloak] { display: none; }
    body { background-color: #f1f5f9; font-family: 'Roboto', sans-serif; }
    
    .main-table {
      max-height: 70vh;
      background: white;
    }
    .main-table thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #1e293b !important;
      color: white !important;
      font-weight: bold;
    }
    .q-table--dense .q-table th, .q-table--dense .q-table td {
      padding: 4px 8px;
    }
    .sticky-header-table .q-table__middle {
      max-height: 500px;
    }
  </style>
</head>
<body>

<div id="q-app" v-cloak>
  <q-layout view="hHh Lpr fFf">
    
    <q-header elevated class="bg-indigo-10 text-white">
      <q-toolbar>
        <q-btn flat dense round icon="menu" @click="drawer = !drawer"></q-btn>
        <q-toolbar-title class="text-weight-bolder">SIGA LITE <span class="text-caption text-weight-light">v2026</span></q-toolbar-title>
        
        <q-chip v-if="form.auth.token" color="green-13" text-color="black" icon="vpn_key" label="Sessão Ativa" dense></q-chip>
        
        <q-btn flat round icon="delete_sweep" @click="confirmClear">
          <q-tooltip>Limpar Tudo</q-tooltip>
        </q-btn>
      </q-toolbar>
      <q-linear-progress v-if="loading" indeterminate color="orange" size="4px"></q-linear-progress>
    </q-header>

    <q-drawer v-model="drawer" show-if-above bordered :width="300" class="bg-grey-1">
      <div class="q-pa-md column q-gutter-md">
        
        <div class="text-overline text-grey-7 text-weight-bold">Acesso & Filtros</div>
        
        <q-input v-model="form.auth.cookies" type="password" label="Cookie siga_session" dense outlined bg-color="white">
          <template v-slot:append>
            <q-icon name="fingerprint" :color="form.auth.token ? 'positive' : 'grey'"></q-icon>
          </template>
        </q-input>

        <div class="row q-col-gutter-xs">
          <div class="col-6">
            <q-input v-model="form.date1" type="date" label="Início" dense outlined stack-label bg-color="white"></q-input>
          </div>
          <div class="col-6">
            <q-input v-model="form.date2" type="date" label="Fim" dense outlined stack-label bg-color="white"></q-input>
          </div>
        </div>

        <q-select
          v-model="selectedAdms"
          :options="adms"
          label="Unidades ADM"
          multiple outlined dense use-chips stack-label
          option-label="name"
          bg-color="white"
        >
          <template v-slot:before-options>
            <q-item clickable @click="toggleSelectAll">
              <q-item-section class="text-primary text-weight-bold">Inverter Seleção</q-item-section>
            </q-item>
          </template>
        </q-select>

        <div class="text-overline text-grey-7 text-weight-bold q-mt-md">Módulos</div>
        <q-list dense bordered class="bg-white rounded-borders">
          <q-item v-for="opt in form.options" :key="opt.id" tag="label" v-ripple>
            <q-item-section avatar><q-checkbox v-model="opt.active" dense></q-checkbox></q-item-section>
            <q-item-section><q-item-label>{{ opt.label }}</q-item-label></q-item-section>
          </q-item>
        </q-list>

        <q-btn color="primary" class="full-width q-mt-lg" size="lg" unelevated 
               :loading="loading" @click="runExtraction" 
               :disabled="!form.auth.token || !selectedAdms.length">
          CAPTURAR DADOS
        </q-btn>
      </div>
    </q-drawer>

    <q-page-container>
      <q-page class="q-pa-md">
        
        <div v-if="hasAnyData">
          <template v-for="opt in form.options" :key="opt.id">
            <q-card v-if="opt.active && getConsolidatedData(opt.id).length" flat bordered class="q-mb-xl shadow-2">
              <q-toolbar class="bg-blue-grey-1 text-blue-grey-10">
                <q-icon :name="opt.icon || 'table_chart'" size="md" class="q-mr-sm"></q-icon>
                <q-toolbar-title class="text-weight-bold text-uppercase">{{ opt.label }}</q-toolbar-title>
                
                <q-btn flat round icon="content_copy" color="primary" @click="copyTable(opt.id)">
                  <q-tooltip>Copiar para Excel</q-tooltip>
                </q-btn>
                <q-btn flat round icon="download" color="primary" @click="downloadCSV(opt.id)">
                  <q-tooltip>Baixar CSV</q-tooltip>
                </q-btn>
              </q-toolbar>

              <q-separator></q-separator>

              <q-table
                flat dense
                :rows="getConsolidatedData(opt.id)"
                :columns="generateColumns(getConsolidatedData(opt.id))"
                row-key="uniqueId"
                :pagination="{ rowsPerPage: 10 }"
                class="main-table"
              >
                <template v-slot:body-cell="props">
                  <q-td :props="props" class="text-weight-medium">
                    {{ props.value }}
                  </q-td>
                </template>
              </q-table>
            </q-card>
          </template>
        </div>

        <div v-else class="column items-center justify-center text-grey-5" style="min-height: 70vh;">
          <q-icon name="analytics" size="100px"></q-icon>
          <div class="text-h6">Nenhum dado extraído ainda</div>
          <div class="text-caption">Ajuste o cookie e clique em Capturar Dados.</div>
        </div>

      </q-page>
    </q-page-container>
  </q-layout>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quasar@2.12.0/dist/quasar.umd.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quasar@2.12.0/dist/lang/pt-BR.umd.prod.js"></script>

<script>
  const { createApp, ref, computed, onMounted, watch } = Vue;
  const { useQuasar, exportFile } = Quasar;
  const API_URL = 'https://node.goias.ifg.edu.br';
  const STORAGE_KEY = 'SIGA_APP_STORAGE';

  const app = createApp({
    setup() {
      const $q = useQuasar();
      const loading = ref(false);
      const drawer = ref(true);
      const adms = ref([]);
      const selectedAdms = ref([]);
      const storage = ref({}); // { IGREJA_COD: { fluxos: [], eventos: [], igrejas: [] } }

      const form = ref({
        auth: { cookies: '', token: '' },
        date1: new Date().toISOString().split('T')[0],
        date2: new Date().toISOString().split('T')[0],
        options: [
          { id: 'igrejas', label: 'Igrejas', active: true, icon: 'add_location_alt' },
          { id: 'fluxos', label: 'Financeiro', active: true, icon: 'payments' },
          { id: 'eventos', label: 'Eventos', active: false, icon: 'event' }
        ]
      });

      // --- PERSISTÊNCIA ---
      const saveState = () => {
        const data = {
          form: form.value,
          adms: adms.value,
          selectedAdms: selectedAdms.value,
          storage: storage.value
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      };

      const loadState = () => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            form.value = parsed.form;
            adms.value = parsed.adms;
            selectedAdms.value = parsed.selectedAdms;
            storage.value = parsed.storage;
          } catch (e) { console.error("Falha ao restaurar cache"); }
        }
      };

      // --- API CORE ---
      const api = async (end, data) => {
        try {
          const res = await fetch(`${API_URL}/${end}`, { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify(data) 
          });
          if (!res.ok) throw new Error(`Erro ${res.status}`);
          return await res.json();
        } catch (e) {
          $q.notify({ color: 'negative', message: `Erro na rota ${end}`, icon: 'error', position: 'top-right' });
          return null;
        }
      };

      const login = async () => {
        if (!form.value.auth.cookies || form.value.auth.cookies.length < 15) return;
        loading.value = true;
        const res = await api('siga-login', { Cookie: form.value.auth.cookies });
        
        if (res?.data) {
          const user = typeof res.data === 'string' ? JSON.parse(res.data) : res.data;
          form.value.auth.token = user.token || user.id;
          
          const resIgs = await api('siga-igrejas', { Cookie: form.value.auth.cookies });
          const churches = Array.isArray(resIgs) ? resIgs : (resIgs?.payload || []);
          
          const map = new Map();
          churches.forEach(ig => {
            if (!map.has(ig.UNIDADE_COD)) {
              map.set(ig.UNIDADE_COD, { id: ig.UNIDADE_COD, name: ig.IGREJA_ADM || 'GERAL', churches: [] });
            }
            map.get(ig.UNIDADE_COD).churches.push(ig);
            if (!storage.value[ig.IGREJA_COD]) storage.value[ig.IGREJA_COD] = { igrejas: [ig], fluxos: [], eventos: [] };
          });
          
          adms.value = Array.from(map.values()).sort((a,b) => a.name.localeCompare(b.name));
          $q.notify({ color: 'positive', message: 'Conectado com sucesso!', icon: 'check' });
          saveState();
        }
        loading.value = false;
      };

      // Watcher Cookie (Auto-login)
      watch(() => form.value.auth.cookies, (val) => {
        if (val?.length > 30) login();
      });

      const runExtraction = async () => {
        loading.value = true;
        const targetIgs = selectedAdms.value.flatMap(a => a.churches).filter(i => i.IGREJA_TIPO === 3);
        
        for (const ig of targetIgs) {
          try {
            await api('siga-alterar-igreja', { Cookie: form.value.auth.cookies, igreja: ig });
            
            for (const t of form.value.options.filter(o => o.active && o.id !== 'igrejas')) {
              const res = await api(`siga-${t.id}`, { 
                Cookie: form.value.auth.cookies, 
                igreja: ig, data1: form.value.date1, data2: form.value.date2 
              });
              const clean = res?.data ? (typeof res.data === 'string' ? JSON.parse(res.data) : res.data) : (res?.payload || res);
              if (Array.isArray(clean)) storage.value[ig.IGREJA_COD][t.id] = clean;
            }
          } catch (e) {}
        }
        
        loading.value = false;
        saveState();
        $q.notify({ color: 'primary', message: 'Extração completa!', icon: 'done_all' });
      };

      // --- TRATAMENTO DE DADOS ---
      const getConsolidatedData = (type) => {
        const results = [];
        Object.keys(storage.value).forEach(igCod => {
          const items = storage.value[igCod][type] || [];
          items.forEach((item, index) => {
            results.push({
              ...item,
              ADM_NOME: storage.value[igCod].igrejas[0]?.IGREJA_ADM || 'N/A',
              IGREJA_NOME: storage.value[igCod].igrejas[0]?.IGREJA_DESC || 'N/A',
              uniqueId: `${igCod}-${type}-${index}`
            });
          });
        });
        return results;
      };

      const generateColumns = (rows) => {
        if (!rows.length) return [];
        const keys = Object.keys(rows[0]).filter(k => k !== 'uniqueId');
        // Mover ADM e Igreja para o início
        const sortedKeys = ['ADM_NOME', 'IGREJA_NOME', ...keys.filter(k => k !== 'ADM_NOME' && k !== 'IGREJA_NOME')];
        return sortedKeys.map(k => ({
          name: k, label: k.replace(/_/g, ' '), field: k, align: 'left', sortable: true
        }));
      };

      // --- EXPORTAÇÃO ---
      const copyTable = (type) => {
        const data = getConsolidatedData(type);
        if (!data.length) return;
        const headers = Object.keys(data[0]).filter(k => k !== 'uniqueId');
        const content = [headers.join('\t'), ...data.map(row => headers.map(h => row[h]).join('\t'))].join('\n');
        Quasar.copyToClipboard(content).then(() => $q.notify({ message: 'Copiado para o Excel!', color: 'green' }));
      };

      const downloadCSV = (type) => {
        const data = getConsolidatedData(type);
        if (!data.length) return;
        const headers = Object.keys(data[0]).filter(k => k !== 'uniqueId');
        const csvContent = [headers.join(','), ...data.map(row => headers.map(h => `"${row[h]}"`).join(','))].join('\r\n');
        const status = exportFile(`${type}_extract.csv`, csvContent, 'text/csv');
        if (!status) $q.notify({ color: 'negative', message: 'Erro ao baixar arquivo' });
      };

      const toggleSelectAll = () => {
        selectedAdms.value = selectedAdms.value.length === adms.value.length ? [] : [...adms.value];
      };

      const confirmClear = () => {
        $q.dialog({ title: 'Limpar tudo?', message: 'Isso apagará o cache do navegador.', cancel: true }).onOk(() => {
          localStorage.removeItem(STORAGE_KEY);
          window.location.reload();
        });
      };

      onMounted(() => { 
        Quasar.lang.set(Quasar.lang.ptBR);
        loadState();
      });

      return {
        drawer, form, loading, adms, selectedAdms, storage,
        hasAnyData: computed(() => Object.keys(storage.value).some(k => storage.value[k].fluxos.length > 0 || storage.value[k].eventos.length > 0)),
        runExtraction, getConsolidatedData, generateColumns, copyTable, downloadCSV, toggleSelectAll, confirmClear
      };
    }
  });

  app.use(Quasar, { config: { notify: { timeout: 2500, position: 'top-right' } } });
  app.mount('#q-app');
</script>

</body>
</html>
